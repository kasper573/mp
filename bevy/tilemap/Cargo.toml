[package]
name = "bevy_tilemap"
version.workspace = true
edition.workspace = true
description = "Generic Bevy renderer for grid tilemaps and tile sprites"
repository = "https://github.com/kasper573/rift"
authors = ["kasper573"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_color",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_log",
    "png",
] }
