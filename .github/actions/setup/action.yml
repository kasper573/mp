name: Set up the build environment
description: Pinned toolchain, just, and the Linux system libraries cargo can't provide.
inputs:
  deps:
    description: "What the job runs, which decides the Linux system packages it gets: build | test | e2e."
    default: build
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Install the pinned toolchain
      shell: bash
      run: rustup show
    - name: Install wasm-bindgen-cli matching the lockfile
      if: runner.os == 'Linux' && inputs.deps == 'e2e'
      shell: bash
      # `just wasm` post-processes the client with `wasm-bindgen`, whose version must match the
      # `wasm-bindgen` crate exactly; grab that prebuilt release rather than compiling the CLI.
      run: |
        version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/, ""); print}' Cargo.lock)
        curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
        sudo install "/tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
        wasm-bindgen --version
    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      # `-sys` crates link system C libraries cargo can't supply (the one platform-specific place, per
      # the repo's platform rule): the x11/gl libs, cmake/g++ for the native `ui` gallery and
      # `bevy_render`, and alsa for kira's cpal backend (the client audio code compiles natively too).
      # The gameplay tests run the desktop client on Xwayland in a headless weston through Mesa's
      # software Vulkan, its keyboard through the xkbcommon-x11 winit loads at runtime, drive it with
      # xdotool, and record its picture with ffmpeg and its sound with parecord, from a PulseAudio sink
      # it plays into through ALSA's pulse plugin. xvfb + the Mesa DRI
      # driver are for the e2e's headed browsers (software WebGL). Drop the runner's microsoft/azure
      # apt sources first — unused, and they 403 intermittently.
      env:
        BUILD_PACKAGES: >-
          cmake g++ libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev
          libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev
        TEST_PACKAGES: >-
          mesa-vulkan-drivers weston xwayland libxkbcommon-x11-0 xdotool ffmpeg pulseaudio
          pulseaudio-utils libasound2-plugins
        E2E_PACKAGES: xvfb libgl1-mesa-dri
        DEPS: ${{ inputs.deps }}
      run: |
        case "$DEPS" in
          build) packages="$BUILD_PACKAGES" ;;
          test) packages="$BUILD_PACKAGES $TEST_PACKAGES" ;;
          e2e) packages="$BUILD_PACKAGES $E2E_PACKAGES" ;;
          *) echo "::error::unknown deps '$DEPS'"; exit 1 ;;
        esac
        sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure*
        sudo apt-get update
        sudo apt-get install -y $packages
    - name: Set up Node for the e2e
      if: inputs.deps == 'e2e'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
